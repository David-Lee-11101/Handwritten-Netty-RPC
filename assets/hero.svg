<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Handwritten Netty RPC</title><desc id="desc">Repository card showing a client, Netty transport, request correlation, and a provider.</desc>
  <rect width="1200" height="630" fill="#111820"/><rect x="54" y="54" width="1092" height="522" rx="28" fill="#17222D" stroke="#334455"/>
  <text x="92" y="150" fill="#E8A65B" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3">BUILT FROM FIRST PRINCIPLES</text>
  <text x="92" y="225" fill="#F4EEE3" font-family="Arial,sans-serif" font-size="58" font-weight="700">Handwritten Netty RPC</text>
  <text x="94" y="270" fill="#AFC0CD" font-family="Arial,sans-serif" font-size="24">Transport, invocation, correlation, deadlines, and channel lifecycle.</text>
  <g font-family="Arial,sans-serif" text-anchor="middle"><rect x="96" y="366" width="190" height="92" rx="16" fill="#223140" stroke="#7790A2"/><text x="191" y="422" fill="#F4EEE3" font-size="23">Client proxy</text><path d="M286 412 H430" stroke="#E8A65B" stroke-width="5"/><circle cx="452" cy="412" r="22" fill="none" stroke="#E8A65B" stroke-width="5"/><text x="452" y="418" fill="#F4EEE3" font-size="16">ID</text><path d="M474 412 H618" stroke="#E8A65B" stroke-width="5"/><rect x="618" y="366" width="205" height="92" rx="16" fill="#223140" stroke="#7790A2"/><text x="720" y="422" fill="#F4EEE3" font-size="23">Netty channel</text><path d="M823 412 H930" stroke="#E8A65B" stroke-width="5"/><rect x="930" y="366" width="174" height="92" rx="16" fill="#223140" stroke="#7790A2"/><text x="1017" y="422" fill="#F4EEE3" font-size="23">Provider</text></g>
</svg>
